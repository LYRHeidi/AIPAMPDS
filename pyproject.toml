[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[project]
name = "aipampds"
version = "0.1.0"
description = "Local antimicrobial peptide generation and screening"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "torch==2.7.0",
  "tensorflow-cpu==2.14.0",
  "numpy==1.25.2",
  "scipy==1.15.3",
  "pandas==2.3.3",
  "scikit-learn==1.3.0",
  "transformers==4.31.0",
  "modlamp==4.3.0",
]

[project.optional-dependencies]
cpu = ["torch==2.7.0"]
cu128 = ["torch==2.7.0"]

[project.scripts]
aipampds = "aipampds.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<0.12", "keras-preprocessing==1.1.2"]

[tool.uv]
required-version = ">=0.13.1"
default-groups = ["dev"]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]
override-dependencies = ["mysql-connector-python==8.0.33"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real model inference using explicitly supplied weights"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
